<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070a13"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="cyberCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="neonPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7928ca"/><stop offset="100%" stop-color="#ff0080"/></linearGradient><linearGradient id="glowLineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/><stop offset="50%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#7928ca" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="dropShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".9" stdDeviation="6"/></filter><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".5" stroke-width=".7" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity=".3"/></pattern><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}@keyframes circuitFlow{0%{stroke-dashoffset:600}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes scanline{0%{transform:translateY(-50px);opacity:0}50%{opacity:.25}}@keyframes hexFlicker{0%{opacity:.15}30%{opacity:.35}70%{opacity:.08}}.anim-pulse{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.anim-circuit{stroke-dasharray:120,80;animation:circuitFlow 12s linear infinite}.anim-circuit-rev{stroke-dasharray:80,120;animation:circuitFlow 9s linear infinite reverse}.anim-scan{animation:scanline 7s ease-in-out infinite}.anim-hex{animation:hexFlicker 4s ease-in-out infinite}.anim-float{animation:floatSlow 5s ease-in-out infinite}.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:52px;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:20px;letter-spacing:.2px}.pill-text{font-weight:600;font-size:13px;letter-spacing:.5px}</style></defs><rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="380" fill="url(#gridPattern)" rx="16"/><g class="anim-pulse"><circle cx="200" cy="190" r="150" fill="#00f2fe" fill-opacity=".08" filter="url(#glow)"/><circle cx="1000" cy="190" r="160" fill="#7928ca" fill-opacity=".09" filter="url(#glow)"/><circle cx="600" cy="280" r="110" fill="#ff0080" fill-opacity=".05" filter="url(#glow)"/></g><g opacity=".6"><path fill="none" stroke="#00f2fe" stroke-opacity=".4" stroke-width="2" d="M 0 80 L 260 80 L 320 140 L 480 140" class="anim-circuit"/><circle cx="480" cy="140" r="4" fill="#00f2fe"/><path fill="none" stroke="#7928ca" stroke-opacity=".4" stroke-width="2" d="M 1200 100 L 940 100 L 880 150 L 750 150" class="anim-circuit-rev"/><circle cx="750" cy="150" r="4" fill="#ff0080"/><path fill="none" stroke="#4facfe" stroke-opacity=".3" stroke-width="1.5" d="M 50 340 L 220 340 L 280 290 L 420 290" class="anim-circuit"/><path fill="none" stroke="#00f2fe" stroke-opacity=".3" stroke-width="1.5" d="M 1150 320 L 980 320 L 920 270 L 800 270" class="anim-circuit-rev"/></g><g fill="#38bdf8" class="anim-hex" font-family="Courier, monospace" font-size="12" opacity=".18"><text x="50" y="140">0x7F 0x45 0x4C 0x46</text><text x="50" y="165">push rbp</text><text x="50" y="190">mov rbp, rsp</text><text x="50" y="215">sub rsp, 0x20</text><text x="50" y="240">call sym.decompile</text><text x="980" y="140">4D 5A 90 00 03 00</text><text x="980" y="165">xor eax, eax</text><text x="980" y="190">test rax, rax</text><text x="980" y="215">jnz loc_entry</text><text x="980" y="240">ret 0x10</text></g><rect width="1200" height="2" x="0" y="0" fill="url(#glowLineGrad)" class="anim-scan"/><g id="foreground" style="isolation:isolate"><g transform="translate(425, 52)"><rect width="350" height="32" x="0" y="0" fill="#0f172a" stroke="#00f2fe" stroke-opacity=".7" stroke-width="1.2" filter="url(#softGlow)" rx="16"/><circle cx="16" cy="16" r="4" fill="#00f2fe"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="32" y="21" fill="#38bdf8" class="pill-text">REVERSE ENGINEERING ECOSYSTEM</text></g><text x="600" y="150" fill="#fff" class="title-text" filter="url(#dropShadow)" text-anchor="middle">Awesome Reverse Engineering</text><text x="600" y="150" fill="url(#cyberCyan)" class="title-text" filter="url(#glow)" opacity=".3" text-anchor="middle">Awesome Reverse Engineering</text><text x="600" y="195" fill="#cbd5e1" class="subtitle-text" filter="url(#dropShadow)" text-anchor="middle">Curated Directory of Disassemblers, Decompilers, Binary Analysis Platforms &amp; Security Toolkits</text><g class="anim-float"><g transform="translate(100, 260) translate(30, 0)"><rect width="140" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" rx="19"/><circle cx="20" cy="19" r="4" fill="#00f2fe"/><text x="34" y="24" fill="#f1f5f9" class="pill-text">Decompilation</text></g><g transform="translate(100, 260) translate(185, 0)"><rect width="135" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" rx="19"/><circle cx="20" cy="19" r="4" fill="#a855f7"/><text x="34" y="24" fill="#f1f5f9" class="pill-text">Disassembly</text></g><g transform="translate(100, 260) translate(335, 0)"><rect width="175" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" rx="19"/><circle cx="20" cy="19" r="4" fill="#ec4899"/><text x="34" y="24" fill="#f1f5f9" class="pill-text">Symbolic Execution</text></g><g transform="translate(100, 260) translate(525, 0)"><rect width="195" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" rx="19"/><circle cx="20" cy="19" r="4" fill="#3b82f6"/><text x="34" y="24" fill="#f1f5f9" class="pill-text">Dynamic Tracing</text></g><g transform="translate(100, 260) translate(735, 0)"><rect width="180" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" rx="19"/><circle cx="20" cy="19" r="4" fill="#10b981"/><text x="34" y="24" fill="#f1f5f9" class="pill-text">Malware Sandbox</text></g></g><rect width="1198" height="378" x="1" y="1" fill="none" stroke="#334155" stroke-opacity=".7" stroke-width="1.5" rx="15"/><path fill="none" stroke="#00f2fe" stroke-width="3" d="M 1 40 L 1 16 L 16 1 L 40 1"/><path fill="none" stroke="#7928ca" stroke-width="3" d="M 1199 40 L 1199 16 L 1184 1 L 1160 1"/><path fill="none" stroke="#7928ca" stroke-width="3" d="M 1 340 L 1 364 L 16 379 L 40 379"/><path fill="none" stroke="#00f2fe" stroke-width="3" d="M 1199 340 L 1199 364 L 1184 379 L 1160 379"/></g></svg>