<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Patterns -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>

    <!-- Animation Styles -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.25; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      @keyframes hexFlicker {
        0%, 100% { opacity: 0.15; }
        30% { opacity: 0.35; }
        70% { opacity: 0.08; }
      }
      .anim-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-circuit {
        stroke-dasharray: 120, 80;
        animation: circuitFlow 12s linear infinite;
      }
      .anim-circuit-rev {
        stroke-dasharray: 80, 120;
        animation: circuitFlow 9s linear infinite reverse;
      }
      .anim-scan {
        animation: scanline 7s ease-in-out infinite;
      }
      .anim-hex {
        animation: hexFlicker 4s ease-in-out infinite;
      }
      .anim-float {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="380" fill="url(#gridPattern)" rx="16" />

  <!-- 2. Ambient Glowing Orbs (Dynamic Background) -->
  <g class="anim-pulse">
    <circle cx="200" cy="190" r="150" fill="#00f2fe" fill-opacity="0.08" filter="url(#glow)" />
    <circle cx="1000" cy="190" r="160" fill="#7928ca" fill-opacity="0.09" filter="url(#glow)" />
    <circle cx="600" cy="280" r="110" fill="#ff0080" fill-opacity="0.05" filter="url(#glow)" />
  </g>

  <!-- 3. Animated Circuit Traces (Background Layer) -->
  <g opacity="0.6">
    <path class="anim-circuit" d="M 0 80 L 260 80 L 320 140 L 480 140" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="480" cy="140" r="4" fill="#00f2fe" />

    <path class="anim-circuit-rev" d="M 1200 100 L 940 100 L 880 150 L 750 150" fill="none" stroke="#7928ca" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="750" cy="150" r="4" fill="#ff0080" />

    <path class="anim-circuit" d="M 50 340 L 220 340 L 280 290 L 420 290" fill="none" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.3" />
    <path class="anim-circuit-rev" d="M 1150 320 L 980 320 L 920 270 L 800 270" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3" />
  </g>

  <!-- 4. Background Binary / Hex Pattern (Subtle, strictly behind text) -->
  <g class="anim-hex" fill="#38bdf8" font-family="Courier, monospace" font-size="12" opacity="0.18">
    <text x="50" y="140">0x7F 0x45 0x4C 0x46</text>
    <text x="50" y="165">push   rbp</text>
    <text x="50" y="190">mov    rbp, rsp</text>
    <text x="50" y="215">sub    rsp, 0x20</text>
    <text x="50" y="240">call   sym.decompile</text>

    <text x="980" y="140">4D 5A 90 00 03 00</text>
    <text x="980" y="165">xor    eax, eax</text>
    <text x="980" y="190">test   rax, rax</text>
    <text x="980" y="215">jnz    loc_entry</text>
    <text x="980" y="240">ret    0x10</text>
  </g>

  <!-- 5. Dynamic Laser Scanline Effect -->
  <rect class="anim-scan" x="0" y="0" width="1200" height="2" fill="url(#glowLineGrad)" />

  <!-- 6. FOREGROUND CONTENT (High contrast, drop shadow, never obscured) -->
  <g id="foreground" style="isolation: isolate;">
    <!-- Top Category Pill -->
    <g transform="translate(425, 52)">
      <rect x="0" y="0" width="350" height="32" rx="16" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.7" filter="url(#softGlow)" />
      <circle cx="16" cy="16" r="4" fill="#00f2fe">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="pill-text" fill="#38bdf8">REVERSE ENGINEERING ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient and Glow -->
    <text x="600" y="150" text-anchor="middle" class="title-text" fill="#ffffff" filter="url(#dropShadow)">
      Awesome Reverse Engineering
    </text>
    <text x="600" y="150" text-anchor="middle" class="title-text" fill="url(#cyberCyan)" opacity="0.3" filter="url(#glow)">
      Awesome Reverse Engineering
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="subtitle-text" fill="#cbd5e1" filter="url(#dropShadow)">
      Curated Directory of Disassemblers, Decompilers, Binary Analysis Platforms &amp; Security Toolkits
    </text>

    <!-- Lower Interactive Feature Pills (Dynamic Subtle Float) -->
    <g class="anim-float" transform="translate(100, 260)">
      <!-- Pill 1: Decompilation -->
      <g transform="translate(30, 0)">
        <rect x="0" y="0" width="140" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="20" cy="19" r="4" fill="#00f2fe" />
        <text x="34" y="24" class="pill-text" fill="#f1f5f9">Decompilation</text>
      </g>

      <!-- Pill 2: Disassembly -->
      <g transform="translate(185, 0)">
        <rect x="0" y="0" width="135" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="20" cy="19" r="4" fill="#a855f7" />
        <text x="34" y="24" class="pill-text" fill="#f1f5f9">Disassembly</text>
      </g>

      <!-- Pill 3: Symbolic Execution -->
      <g transform="translate(335, 0)">
        <rect x="0" y="0" width="175" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="20" cy="19" r="4" fill="#ec4899" />
        <text x="34" y="24" class="pill-text" fill="#f1f5f9">Symbolic Execution</text>
      </g>

      <!-- Pill 4: Dynamic Instrumentation -->
      <g transform="translate(525, 0)">
        <rect x="0" y="0" width="195" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="20" cy="19" r="4" fill="#3b82f6" />
        <text x="34" y="24" class="pill-text" fill="#f1f5f9">Dynamic Tracing</text>
      </g>

      <!-- Pill 5: Malware Sandboxes -->
      <g transform="translate(735, 0)">
        <rect x="0" y="0" width="180" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />
        <circle cx="20" cy="19" r="4" fill="#10b981" />
        <text x="34" y="24" class="pill-text" fill="#f1f5f9">Malware Sandbox</text>
      </g>
    </g>

    <!-- Outer High-Tech Border Frame -->
    <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 1 40 L 1 16 L 16 1 L 40 1" fill="none" stroke="#00f2fe" stroke-width="3" />
    <path d="M 1199 40 L 1199 16 L 1184 1 L 1160 1" fill="none" stroke="#7928ca" stroke-width="3" />
    <path d="M 1 340 L 1 364 L 16 379 L 40 379" fill="none" stroke="#7928ca" stroke-width="3" />
    <path d="M 1199 340 L 1199 364 L 1184 379 L 1160 379" fill="none" stroke="#00f2fe" stroke-width="3" />
  </g>
</svg>
